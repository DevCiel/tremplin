<!doctype html>
<html lang="en" data-trm-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremplin sign-in example</title>
  <link rel="stylesheet" href="../dist/css/tremplin.css">
  <link rel="stylesheet" href="examples.css">
</head>
<body>
  <main class="container d-flex align-items-center justify-content-center" style="min-block-size:100dvh;max-inline-size:32rem">
    <section class="card w-100" aria-labelledby="sign-in-title">
      <div class="card-body stack">
        <header><span class="badge">Welcome back</span><h1 id="sign-in-title">Sign in</h1><p class="text-muted">Access your Tremplin workspace.</p></header>
        <form class="stack">
          <div><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
          <div><div class="d-flex justify-content-between"><label class="form-label" for="password">Password</label><a href="#reset">Forgot password?</a></div><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
          <div class="form-check"><input class="form-check-input" id="remember" name="remember" type="checkbox"><label class="form-check-label" for="remember">Keep me signed in</label></div>
          <button class="btn btn-primary" type="submit">Sign in securely</button>
        </form>
        <p class="text-center">New here? <a href="#create">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
