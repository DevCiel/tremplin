<!doctype html>
<html lang="en" data-trm-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tremplin visual regression fixture</title>
  <link rel="stylesheet" href="../dist/css/tremplin.css">
  <style>
    body { padding: 1.5rem; }
    main { inline-size: min(760px, 100%); padding: 1.5rem; color: var(--trm-fg-body); background: var(--trm-bg-body); }
    .fixture-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
    .fixture-box { min-block-size:8rem; padding:1rem; border:1px solid var(--trm-border-color); border-radius:var(--trm-radius-5); }
    /* Explicit application contrast choice, not a change to core defaults. */
    .fixture-list {
      --trm-list-group-active-color: var(--trm-inverse-contrast);
      --trm-list-group-active-bg: var(--trm-inverse-bg);
      --trm-list-group-active-border-color: var(--trm-inverse-bg);
    }
    @media (width < 640px) { .fixture-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1 class="h3">Component baseline</h1>
    <div class="hstack flex-wrap align-items-center gap-2 mb-3"><button class="btn-solid theme-inverse" type="button">Solid</button><button class="btn-outline theme-inverse" type="button">Outline</button><span class="badge">Beta</span></div>
    <div class="fixture-grid">
      <article class="card"><div class="card-header">Header</div><div class="card-body"><h2 class="h5">Card title</h2><p class="mb-0">Stable spacing and typography.</p></div></article>
      <div class="fixture-box"><div class="alert theme-success fg-emphasis-success mb-3">Operation completed.</div><div class="progress" role="progressbar" aria-label="Upload progress" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="inline-size:64%"></div></div></div>
      <div class="fixture-box"><label class="form-label" for="visual-input">Email</label><input class="form-control" id="visual-input" value="team@example.com"><div class="form-text">Supporting text</div></div>
      <div class="fixture-box"><ul class="list-group fixture-list"><li class="list-group-item active">Selected item</li><li class="list-group-item">Another item</li></ul></div>
    </div>
  </main>
</body>
</html>
